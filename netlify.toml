# Déploiement de l'application ZeNote.
#
# Aucune chaîne Kotlin n'est nécessaire ici : le cœur est déjà compilé en
# JavaScript et versionné dans `app/vendor/zenote-core/`. L'hébergeur n'a besoin
# que de Node. Pour le régénérer après modification de `core/`, lancer
# `bash scripts/sync-core-js.sh` et committer le résultat.

[build]
  base = "app"
  # Les dépendances des fonctions serveur s'installent à part : le SDK TypeSafe
  # n'est jamais une dépendance de l'application, donc jamais dans son paquet.
  command = "npm ci --prefix ../netlify && npm run build"
  publish = "dist"

# Le point d'analyse distante (change `analyse-typesafe`). Chemin relatif à `base`.
[functions]
  directory = "../netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "22"
  # Playwright ne sert qu'à la vérification bout en bout, jamais à l'application.
  # Inutile donc de laisser son script d'installation télécharger un navigateur
  # de 400 Mo à chaque construction chez l'hébergeur.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

# L'analyse distante, sur le même domaine que l'application : l'appareil ne
# contacte jamais le fournisseur du modèle, et n'a besoin d'aucun CORS. Avant le
# repli de la page unique, sinon il l'attraperait.
[[redirects]]
  from = "/api/analyser"
  to = "/.netlify/functions/analyser"
  status = 200
  force = true

# L'application tient en une seule page : toute route inconnue retombe dessus.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker ne doit jamais être servi depuis un cache périmé, sinon une
# mise à jour de l'application peut rester invisible pendant des heures.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    # Tout vit dans IndexedDB, sur l'appareil. Par défaut, l'application ne
    # transmet rien. L'analyse distante est réservée à un utilisateur connecté avec
    # un compte, et `/api/analyser` refuse tout appelant non identifié (401). Allumée
    # par un utilisateur connecté, seul le texte des passages des captures qu'il n'a
    # pas gardées partirait, vers ce même domaine — jamais l'audio, les dates ni les
    # identifiants. À noter :
    # l'hébergeur injecte dans la page son propre script de supervision, qui ne
    # fait pas partie de l'application et se désactive dans ses réglages.
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "microphone=(self), geolocation=(), camera=()"
